<!-- Baseline v1 UI preserved as safety fallback -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issue Finder (Baseline v1)</title>
<style>
  :root {
    --panel: #0F1B2D;
    --panel-raised: #17263E;
    --panel-line: #2B3F5F;
    --panel-text: #E8EEF7;
    --panel-muted: #A3B2C8;
    --panel-accent: #FFE36E;

    --bg: #EEF2F6;
    --surface: #FFFFFF;
    --text: #142033;
    --muted: #566579;
    --line: #D5DDE6;
    --accent: #5B3FD6;
    --mark-bg: #FFE36E;
    --mark-text: #2A2200;
    --warn-bg: #FFF1C2;
    --warn-text: #4A3A00;

    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B1220;
      --surface: #111B2E;
      --text: #E6ECF5;
      --muted: #9AA9BD;
      --line: #22314A;
      --accent: #A596FF;
      --mark-bg: #6B5800;
      --mark-text: #FFF3B0;
      --warn-bg: #3A3000;
      --warn-text: #FFE9A0;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
  }

  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  mark {
    background: var(--mark-bg);
    color: var(--mark-text);
    padding: 0 0.15em;
    border-radius: 2px;
  }

  .banner {
    background: var(--warn-bg);
    color: var(--warn-text);
    padding: 10px 24px;
    font-size: 0.9rem;
  }
  .banner code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85em; }

  .layout {
    display: grid;
    grid-template-columns: minmax(300px, 400px) 1fr;
    min-height: 100vh;
  }

  .finder {
    background: var(--panel);
    color: var(--panel-text);
    padding: 44px 32px 40px;
    position: sticky;
    top: 0;
    align-self: start;
    height: 100vh;
    overflow-y: auto;
  }
  .finder h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(1.9rem, 3.2vw, 2.5rem);
    line-height: 1.12;
    letter-spacing: -0.01em;
    margin: 0 0 14px;
  }
  .lede {
    color: var(--panel-muted);
    margin: 0 0 28px;
    max-width: 36ch;
  }

  .field { margin: 0 0 20px; border: 0; padding: 0; min-width: 0; }
  .field > label, .field > legend {
    display: block;
    font-weight: 600;
    font-size: 0.95rem;
    margin: 0 0 8px;
    padding: 0;
  }

  textarea, select {
    width: 100%;
    font: inherit;
    color: var(--panel-text);
    background: var(--panel-raised);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    padding: 12px 14px;
  }
  textarea { resize: vertical; min-height: 92px; }
  textarea::placeholder { color: #7587A0; }
  textarea:focus-visible, select:focus-visible { outline-color: var(--panel-accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input {
    position: absolute;
    opacity: 0;
    inset: 0;
    margin: 0;
    cursor: pointer;
  }
  .chip span {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--panel-line);
    background: transparent;
    font-size: 0.9rem;
    color: var(--panel-text);
  }
  .chip input:checked + span {
    background: var(--panel-text);
    color: var(--panel);
    border-color: var(--panel-text);
  }
  .chip input:focus-visible + span {
    outline: 3px solid var(--panel-accent);
    outline-offset: 2px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #8896AA;
    flex: none;
  }
  .chip small { color: inherit; opacity: 0.65; font-size: 0.8rem; }
  .hint { color: var(--panel-muted); font-size: 0.85rem; margin: 8px 0 0; }

  .go {
    width: 100%;
    font: inherit;
    font-weight: 700;
    padding: 13px 18px;
    border: 0;
    border-radius: 8px;
    background: var(--panel-accent);
    color: #2A2200;
    cursor: pointer;
  }
  .go:hover { filter: brightness(1.05); }
  .go:disabled { opacity: 0.7; cursor: progress; }
  .go:focus-visible { outline-color: #fff; }

  .examples { margin: 28px 0 0; }
  .examples p { margin: 0 0 8px; color: var(--panel-muted); font-size: 0.9rem; }
  .examples button {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    font-size: 0.92rem;
    color: var(--panel-text);
    background: transparent;
    border: 0;
    border-top: 1px solid var(--panel-line);
    padding: 10px 2px;
    cursor: pointer;
  }
  .examples button:last-child { border-bottom: 1px solid var(--panel-line); }
  .examples button:hover { background: var(--panel-raised); }
  .examples button:focus-visible { outline-color: var(--panel-accent); outline-offset: -3px; }

  .stats { margin: 22px 0 0; color: var(--panel-muted); font-size: 0.85rem; }

  main { padding: 44px clamp(20px, 5vw, 64px) 64px; min-width: 0; }
  .results-wrap { max-width: 780px; }

  .results-head h2 {
    font-family: var(--serif);
    font-size: 1.6rem;
    line-height: 1.2;
    margin: 0 0 6px;
  }
  .results-head p { margin: 0; color: var(--muted); }
  .results-head { margin-bottom: 20px; }

  ol.issues {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .issue {
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 4px 12px;
    padding: 22px 22px 22px 18px;
    border-top: 1px solid var(--line);
  }
  .issue:first-child { border-top: 0; }
  .rank {
    font-family: var(--serif);
    font-size: 1.5rem;
    line-height: 1.2;
    color: var(--muted);
    text-align: right;
  }
  .issue h3 {
    margin: 0 0 6px;
    font-size: 1.1rem;
    line-height: 1.35;
    font-weight: 650;
  }
  .issue h3 a { color: var(--text); text-decoration-color: var(--line); text-underline-offset: 3px; }
  .issue h3 a:hover { text-decoration-color: var(--accent); color: var(--accent); }

  .where {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
    margin: 0 0 10px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .where .lang { display: inline-flex; align-items: center; gap: 7px; }
  .where .repo { font-weight: 600; color: var(--text); }

  .snippet { margin: 0 0 12px; color: var(--muted); max-width: 68ch; }

  .why { margin: 0 0 12px; font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 6px 6px; align-items: baseline; }
  .why .why-label { color: var(--muted); margin-right: 4px; }
  .why .none { color: var(--muted); }

  .meter { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; color: var(--muted); }
  .meter .bar {
    flex: 0 0 140px;
    height: 6px;
    border-radius: 3px;
    background: var(--line);
    overflow: hidden;
  }
  .meter .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

  .labels { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .labels span {
    font-size: 0.8rem;
    padding: 2px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
  }

  .state {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px 24px;
    color: var(--muted);
  }
  .state strong { display: block; color: var(--text); margin-bottom: 4px; font-size: 1.05rem; }
  .state code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.88em; }

  .fresh { animation: swap 160ms ease-out; }
  @keyframes swap { from { opacity: 0.35; } to { opacity: 1; } }

  .how { max-width: 780px; margin-top: 48px; }
  .how h2 { font-family: var(--serif); font-size: 1.3rem; margin: 0 0 14px; }
  .how ol { margin: 0; padding-left: 1.3em; }
  .how li { margin: 0 0 10px; max-width: 70ch; }
  .how li strong { font-weight: 650; }

  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
    .finder { position: static; height: auto; padding: 32px 16px 28px; }
    main { padding: 28px 16px 48px; }
    .issue { grid-template-columns: 1fr; padding: 18px 16px; }
    .rank { text-align: left; font-size: 1.1rem; }
    .banner { padding: 10px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fresh { animation: none; }
  }
</style>
</head>
<body>
<div class="layout">
  <main style="padding: 40px;">
    <h1>Original V1 Backup</h1>
    <p>This is the fallback copy of the baseline v1 interface.</p>
  </main>
</div>
</body>
</html>
